[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferci"
version = "0.2.0"
description = "Neutral, reproducible inference performance & cost regression CI (BYO-runner orchestrator)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "InferCI contributors" }]
# 刻意零运行时依赖：harness 必须能在任意 CI/Docker/裸机上直接运行，
# 依赖越少，越可复现、越可信。这就是中立性的工程前提。
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "coverage>=7.0",
    "pre-commit>=3.0",
]

[project.scripts]
inferci = "inferci.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inferci*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM115",  # open() for subprocess log files in tests is intentional
    "SIM105",  # defensive try/except: pass in cleanup/__del__ paths
    "RUF012",  # class-level read-only "knob" attrs (overridden by subclasses, never mutated)
]

[tool.coverage.run]
source = ["inferci"]
omit = ["inferci/__main__.py"]

[tool.coverage.report]
# CI runs without a llama.cpp binary/model, so GPU/network integration paths
# (runners/serving.py real HTTP, llama_server launch, quality NIAH) are skipped
# there; 60 is the CI floor. Full coverage (~80%) requires the local
# integration environment (see CONTRIBUTING).
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]
