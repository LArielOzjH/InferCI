name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        working-directory: inferci
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        working-directory: inferci
        run: ruff check inferci tests
      - name: Ruff format check
        working-directory: inferci
        run: ruff format --check inferci tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        working-directory: inferci
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        working-directory: inferci
        run: |
          # Integration tests skip on CI (no llama.cpp binary/model), so the
          # gate is the CI floor (60). Full coverage (~80%) needs the local
          # integration environment.
          coverage run --source=inferci -m unittest discover -s tests
          coverage report --fail-under=60
